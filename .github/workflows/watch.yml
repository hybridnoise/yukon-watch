name: yukon-watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a harmless test note to the webhook"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: yukon-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Yukon and Layr-Labs
        env:
          YUKON_WEBHOOK_URL: ${{ secrets.YUKON_WEBHOOK_URL }}
          YUKON_WEBHOOK_KEY: ${{ secrets.YUKON_WEBHOOK_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YUKON_FORCE_TEST: ${{ inputs.test && '1' || '0' }}
        run: python watch.py
      - name: Save state if it changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "yukon-watch"
            git config user.email "yukon-watch@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
